name: Lowman XAJ convergence E2E

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/lowman-xaj-agent-e2e
    paths:
      - '.github/workflows/lowman-agent-e2e.yml'
      - 'scripts/run_lowman_convergence_experiment.py'
      - 'src/hydro_agent/agent/**'
      - 'src/hydro_agent/optimization/**'
      - 'src/hydro_agent/services/snapshots.py'
      - 'src/hydro_agent/skills/**'
      - 'src/hydro_agent/workbench/**'
      - 'tests/optimization/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  lowman-convergence-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SILICONFLOW_API_KEY: ${{ secrets.LLM_KEY }}
      HYDRO_LLM_TIMEOUT_SECONDS: '90'
      HYDRO_LLM_MAX_RETRIES: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install test, data, XAJ and agent dependencies
        run: uv sync --frozen --extra dev --extra data --extra xaj --extra api

      - name: Verify convergence Gate unit tests
        run: |
          uv run pytest -q \
            tests/optimization/test_gate.py \
            tests/agent/test_siliconflow_provider.py \
            tests/agent/test_skills_and_diagnose.py

      - name: Verify LLM secret is available
        shell: bash
        run: |
          if [ -z "$SILICONFLOW_API_KEY" ]; then
            echo 'Repository secret LLM_KEY is missing or empty.' >&2
            exit 2
          fi

      - name: Prepare ten-year Lowman forcing and observed discharge
        run: |
          mkdir -p data/source
          uv run python scripts/prepare_lowman_source.py \
            --output data/source/camels_13235000 \
            --start 2010-01-01 \
            --end 2020-08-05

      - name: Run convergence-controlled SiliconFlow XAJ calibration
        run: |
          uv run python scripts/run_lowman_convergence_experiment.py \
            --source data/source/camels_13235000 \
            --scheme tests/fixtures/xaj/lowman_scheme.json \
            --output artifacts/lowman-convergence-e2e \
            --calibration-start 2011-01-01 \
            --calibration-end 2017-12-31 \
            --gate-start 2018-01-01 \
            --gate-end 2019-12-31 \
            --final-start 2020-04-01 \
            --final-end 2020-07-31 \
            --warmup-days 365 \
            --diagnostic-days 60 \
            --max-rounds 100 \
            --max-opt-cycles 20

      - name: Print experiment summary
        if: always()
        run: |
          if [ -f artifacts/lowman-convergence-e2e/summary.md ]; then
            cat artifacts/lowman-convergence-e2e/summary.md
          fi
          if [ -f artifacts/lowman-convergence-e2e/summary.json ]; then
            cat artifacts/lowman-convergence-e2e/summary.json
          fi

      - name: Upload full experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowman-xaj-convergence-e2e
          path: artifacts/lowman-convergence-e2e/
          if-no-files-found: warn
          retention-days: 14

name: Archify Preview

on:
  push:
    branches:
      - archify-dual-model-preview
    paths:
      - 'docs/diagrams/hydro-agent.dual-model.workflow.json'
      - '.github/workflows/archify-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      ARCHIFY_UPDATE_CHECK_DISABLED: '1'
    steps:
      - name: Checkout hydro-agent
        uses: actions/checkout@v4

      - name: Download Archify
        run: |
          curl -fL 'https://github.com/tt-a1i/archify/raw/refs/heads/main/archify.zip' -o /tmp/archify.zip
          mkdir -p /tmp/archify-skill
          unzip -q /tmp/archify.zip -d /tmp/archify-skill
          node /tmp/archify-skill/archify/bin/archify.mjs doctor

      - name: Validate workflow source
        run: |
          node /tmp/archify-skill/archify/bin/archify.mjs validate workflow \
            docs/diagrams/hydro-agent.dual-model.workflow.json \
            --quality showcase --json

      - name: Render with Archify
        run: |
          node /tmp/archify-skill/archify/bin/archify.mjs deliver workflow \
            docs/diagrams/hydro-agent.dual-model.workflow.json \
            /tmp/hydro-agent.archify.html \
            --quality showcase --json

      - name: Upload Archify HTML
        uses: actions/upload-artifact@v4
        with:
          name: hydro-agent-archify-preview
          path: /tmp/hydro-agent.archify.html
          if-no-files-found: error

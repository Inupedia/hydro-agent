name: P1 branch validation
on:
  push:
    branches:
      - 'feat/p1-diagnosis-driven-calibration'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --extra data --extra dev --extra api --extra xaj
      - run: uv run ruff check src tests

  p1-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --extra data --extra dev --extra api --extra xaj
      - run: uv run pytest tests/optimization tests/evaluation tests/agent tests/experience -v

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --extra data --extra dev --extra api --extra xaj
      - run: uv run pytest tests/workbench -v

  full-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --extra data --extra dev --extra api --extra xaj
      - run: uv run pytest -q

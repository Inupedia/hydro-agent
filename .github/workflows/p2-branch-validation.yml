name: P2 final validation
on:
  push:
    branches:
      - 'feat/p2-spatial-unit-recommendation'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --extra data --extra dev --extra api --extra xaj --extra xaj-dem
      - run: uv run ruff check src tests scripts/run_workbench_api.py
      - run: uv run pytest tests/hydrology tests/modeling -v
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run src/__tests__/SpatialHeterogeneityPanel.test.ts src/__tests__/ModelPreparation.test.ts
      - run: npm test -- --run
      - run: npm run build

name: P2 branch validation
on:
  push:
    branches:
      - 'feat/p2-spatial-unit-recommendation'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --extra data --extra dev --extra api --extra xaj --extra xaj-dem
      - run: uv run pytest tests/hydrology/test_spatial_profile.py tests/modeling/test_unit_candidates.py tests/modeling/test_plans.py tests/modeling/test_review_map.py tests/modeling/test_hydrologist.py -v

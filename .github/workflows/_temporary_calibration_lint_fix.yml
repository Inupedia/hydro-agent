name: Temporary Calibration Lint Fix

on:
  push:
    branches:
      - feat/calibration-scientist-v2

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibration-scientist-v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Apply safe Ruff fixes
        run: uv run --frozen ruff check src tests --fix
      - name: Commit lint fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "chore: apply safe ruff fixes"
          git push origin HEAD:feat/calibration-scientist-v2

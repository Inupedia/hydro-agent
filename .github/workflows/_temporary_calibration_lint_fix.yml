name: Temporary Calibration Lint Fix

on:
  push:
    branches:
      - feat/calibration-scientist-v2

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/calibration-scientist-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibration-scientist-v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Apply safe Ruff fixes
        run: uv run --frozen ruff check src tests --fix
      - name: Write fixed files through GitHub Contents API
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only -- src tests)
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          for file in "${files[@]}"; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${TARGET_BRANCH}" --jq .sha)
            python - "${file}" "${sha}" "${TARGET_BRANCH}" > /tmp/request.json <<'PY'
          import base64
          import json
          import pathlib
          import sys

          path, sha, branch = sys.argv[1:]
          payload = {
              "message": f"chore: apply safe ruff fix to {path}",
              "content": base64.b64encode(pathlib.Path(path).read_bytes()).decode("ascii"),
              "sha": sha,
              "branch": branch,
          }
          print(json.dumps(payload))
          PY
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${file}" --input /tmp/request.json >/dev/null
          done

name: Workflow SSOT

on:
  push:
    paths:
      - 'workflow/**'
      - 'src/hydro_agent/workflow/**'
      - 'web/src/generated/**'
      - 'web/src/components/LiveWorkflow.vue'
      - 'web/src/__tests__/LiveWorkflow.test.ts'
      - 'scripts/sync_workflow.py'
      - '.github/workflows/workflow-ssot.yml'
  pull_request:
    paths:
      - 'workflow/**'
      - 'src/hydro_agent/workflow/**'
      - 'web/src/generated/**'
      - 'web/src/components/LiveWorkflow.vue'
      - 'web/src/__tests__/LiveWorkflow.test.ts'
      - 'scripts/sync_workflow.py'
      - '.github/workflows/workflow-ssot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hydro-Agent
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install Python package
        run: uv sync --frozen --extra dev --extra data

      - name: Validate workflow definition and generated metadata
        run: uv run --frozen python scripts/sync_workflow.py --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test workflow UI
        working-directory: web
        run: npm test -- LiveWorkflow.test.ts

      - name: Build web app
        working-directory: web
        run: npm run build

name: Python tests
on:
  push:
    paths: ['src/**', 'tests/**', 'workflow/**', 'scripts/sync_workflow.py', 'web/src/generated/**', 'web/public/workflow-meta.js', 'docs/diagrams/**', 'pyproject.toml', 'uv.lock', '.github/workflows/python-tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'workflow/**', 'scripts/sync_workflow.py', 'web/src/generated/**', 'web/public/workflow-meta.js', 'docs/diagrams/**', 'pyproject.toml', 'uv.lock', '.github/workflows/python-tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen python scripts/sync_workflow.py --check
      - run: uv run --frozen pytest -q

name: Python tests
on:
  push:
    paths: ['src/**', 'tests/**', 'workflow/**', 'scripts/sync_workflow.py', 'web/src/generated/**', 'web/public/workflow-meta.js', 'docs/diagrams/**', 'pyproject.toml', 'uv.lock', '.github/workflows/python-tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'workflow/**', 'scripts/sync_workflow.py', 'web/src/generated/**', 'web/public/workflow-meta.js', 'docs/diagrams/**', 'pyproject.toml', 'uv.lock', '.github/workflows/python-tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests
      - name: Ruff format gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -t NEW_PY_FILES < <(
              git diff --name-only --diff-filter=A \
                "${{ github.event.pull_request.base.sha }}" \
                "${{ github.event.pull_request.head.sha }}" \
                | grep -E '^(src|tests)/.*\.py$' || true
            )
            if ((${#NEW_PY_FILES[@]})); then
              uv run --frozen ruff format --check "${NEW_PY_FILES[@]}"
            else
              echo "No newly added Python files to format-check."
            fi
          else
            uv run --frozen ruff format --check src tests
          fi
      - run: uv run --frozen python scripts/sync_workflow.py --check
      - run: uv run --frozen pytest -q

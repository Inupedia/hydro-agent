name: Python tests
on:
  push:
    paths: ['src/**', 'tests/**', 'workflow/**', 'scripts/sync_workflow.py', 'web/src/generated/**', 'web/public/workflow-meta.js', 'docs/diagrams/**', 'pyproject.toml', 'uv.lock', '.github/workflows/python-tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'workflow/**', 'scripts/sync_workflow.py', 'web/src/generated/**', 'web/public/workflow-meta.js', 'docs/diagrams/**', 'pyproject.toml', 'uv.lock', '.github/workflows/python-tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev --extra xaj-dem --extra api
      - run: uv run --frozen ruff check src tests
      - name: Ruff format gate
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_PY_FILE_LIST="$(mktemp)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "${HEAD_SHA}" \
              | grep -E '^(src|tests)/.*\.py$' > "${CHANGED_PY_FILE_LIST}" || true
          else
            git diff --name-only --diff-filter=ACMRT "${BASE_SHA}" "${HEAD_SHA}" \
              | grep -E '^(src|tests)/.*\.py$' > "${CHANGED_PY_FILE_LIST}" || true
          fi

          if [[ -s "${CHANGED_PY_FILE_LIST}" ]]; then
            status=0
            while IFS= read -r file; do
              uv run --frozen ruff format --check "${file}" || status=1
            done < "${CHANGED_PY_FILE_LIST}"
            exit "${status}"
          fi
          echo "No changed Python files to format-check."
      - run: uv run --frozen python scripts/sync_workflow.py --check
      - run: uv run --frozen pytest -q
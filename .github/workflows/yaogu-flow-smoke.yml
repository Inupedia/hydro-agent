name: Yaogu Full Flow Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/smoke_yaogu_full_flow.py"
      - "src/hydro_agent/**"
      - "tests/**"
      - "data/academy/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/yaogu-flow-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/smoke_yaogu_full_flow.py"
      - "src/hydro_agent/**"
      - "tests/**"
      - "data/academy/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/yaogu-flow-smoke.yml"

jobs:
  yaogu-full-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Calibration scientist, knowledge and teacher-XAJ runtime
        run: uv sync --frozen --extra dev --extra xaj-dem --extra api
      - name: Calibration scientist, expert knowledge and teacher-kernel tests
        run: >-
          uv run --frozen pytest -q
          tests/agent/test_calibration_scientist_provider.py
          tests/agent/test_world_state.py
          tests/services/test_calibration_diagnostics.py
          tests/workbench/test_prevalidation_diagnosis_binding.py
          tests/workbench/test_experiment_timeline.py
          tests/data/test_snapshot_context_horizon.py
          tests/optimization/test_sceua.py
          tests/optimization/test_calibration_scientist.py
          tests/optimization/test_search_boundary_expertise.py
          tests/knowledge/test_cases.py
          tests/knowledge/test_expert.py
          tests/knowledge/test_repository.py
          tests/evaluation/test_gbt22482.py
          tests/models/xaj/test_teacher_kernel.py
          tests/models/xaj/test_calibrate_runtime.py
      - name: Run real Yaogu end-to-end calibration-scientist smoke
        run: uv run --frozen python scripts/smoke_yaogu_full_flow.py
      - name: Print smoke summary
        if: always()
        run: |
          if [ -f artifacts/yaogu-flow-smoke/summary.json ]; then
            cat artifacts/yaogu-flow-smoke/summary.json
          else
            echo "summary.json was not produced"
          fi
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaogu-flow-smoke
          path: artifacts/yaogu-flow-smoke
          if-no-files-found: warn

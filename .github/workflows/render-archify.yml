name: Render Archify Workflow

on:
  push:
    branches:
      - design/archify-workflow-v2
    paths:
      - 'docs/diagrams/hydro-agent.workflow.json'
      - '.github/workflows/render-archify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hydro-Agent
        uses: actions/checkout@v4

      - name: Checkout Archify
        uses: actions/checkout@v4
        with:
          repository: tt-a1i/archify
          ref: main
          path: vendor/archify-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/archify-src/archify/package-lock.json

      - name: Install Archify dependencies
        working-directory: vendor/archify-src/archify
        run: npm ci

      - name: Archify doctor
        run: node vendor/archify-src/archify/bin/archify.mjs doctor

      - name: Validate Hydro-Agent workflow with Archify
        run: |
          node vendor/archify-src/archify/bin/archify.mjs validate workflow docs/diagrams/hydro-agent.workflow.json \
            --quality showcase --json | tee /tmp/archify-validation.json

      - name: Deliver self-contained HTML with Archify
        run: |
          mkdir -p dist
          node vendor/archify-src/archify/bin/archify.mjs deliver workflow docs/diagrams/hydro-agent.workflow.json \
            dist/hydro-agent.workflow.html --quality showcase --json | tee /tmp/archify-delivery.json

      - name: Collect receipts and source
        run: |
          cp /tmp/archify-validation.json dist/archify-validation.json
          cp /tmp/archify-delivery.json dist/archify-delivery.json
          cp docs/diagrams/hydro-agent.workflow.json dist/hydro-agent.workflow.json

      - name: Upload Archify artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydro-agent-archify-workflow
          path: dist/
          if-no-files-found: error

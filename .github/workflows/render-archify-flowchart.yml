name: Render Archify flowchart

on:
  push:
    branches:
      - docs/hydro-agent-archify-flowchart
  pull_request:
    paths:
      - 'docs/diagrams/**'
      - '.github/workflows/render-archify-flowchart.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hydro-agent
        uses: actions/checkout@v4

      - name: Checkout Archify
        uses: actions/checkout@v4
        with:
          repository: tt-a1i/archify
          path: archify-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archify-src/archify/package-lock.json

      - name: Install Archify dependencies
        working-directory: archify-src/archify
        run: npm ci

      - name: Validate workflow
        run: |
          node archify-src/archify/bin/archify.mjs validate workflow docs/diagrams/hydro-agent.workflow.json --quality showcase --json

      - name: Render workflow
        run: |
          mkdir -p dist
          node archify-src/archify/bin/archify.mjs deliver workflow docs/diagrams/hydro-agent.workflow.json dist/hydro-agent.workflow.html --quality showcase --json

      - name: Upload rendered flowchart
        uses: actions/upload-artifact@v4
        with:
          name: hydro-agent-archify-flowchart
          path: |
            dist/hydro-agent.workflow.html
            docs/diagrams/hydro-agent.workflow.json

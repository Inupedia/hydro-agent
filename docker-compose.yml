services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: hydro-agent-workbench:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - hydro-agent-data:/data
      - ./data:/app/data
      - ./tests/fixtures:/app/tests/fixtures:ro
      # Keep runtime in sync with the workspace so hotfixes cannot drift from the image.
      - ./src:/app/src
      - ./scripts/run_workbench_api.py:/app/scripts/run_workbench_api.py:ro
      - ./web/dist:/app/web/dist:ro
    environment:
      HYDRO_AGENT_HOST: "0.0.0.0"
      HYDRO_AGENT_PORT: "8000"
      HYDRO_AGENT_DB: "/data/hydro.db"
      HYDRO_AGENT_REPORTS: "/data/reports"
      HYDRO_AGENT_STATIC: "/app/web/dist"
      HYDRO_AGENT_WORK_ROOT: "/data/runtime"
      HYDRO_AGENT_DATA_ROOT: "/app/data"
      HYDRO_AGENT_BASINS: "/app/data/basins"
      HYDRO_AGENT_ACADEMY: "/app/data/academy"
      HYDRO_AGENT_SOURCE: "/app/tests/fixtures/lowman_reanalysis_source"
      HYDRO_AGENT_SCHEME: "/app/tests/fixtures/xaj/lowman_scheme.json"
      HYDRO_AGENT_MODE: "real"
      HYDRO_LLM_TIMEOUT_SECONDS: "180"
      HYDRO_LLM_MAX_RETRIES: "5"
    restart: unless-stopped

volumes:
  hydro-agent-data:

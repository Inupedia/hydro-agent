[project]
name = "hydro-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3", "psutil>=6.1,<8", "sqlalchemy>=2.0,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
data = ["numpy>=2.2.6,<3", "numcodecs>=0.16,<1"]
xaj = [
  "hydromodel @ git+https://github.com/OuyangWenyu/hydromodel.git@89d7a8ed1d72ce4fffbbd9897490b089382ecbac",
]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "httpx>=0.28,<1"]
agent-openai = ["openai>=1"]
api = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Audited XAJ-only import path; excludes unrelated upstream data/training stacks.
[[tool.uv.dependency-metadata]]
name = "hydromodel"
version = "0.4.0"
requires-dist = ["numpy>=2.2.6,<3", "scipy>=1.15,<2", "numba>=0.61,<1", "pyyaml>=6,<7"]

[tool.hatch.metadata]
allow-direct-references = true

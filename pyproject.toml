[project]
name = "hydro-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3", "psutil>=6.1,<8", "sqlalchemy>=2.0,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
data = ["numpy>=2.2.6,<3", "numcodecs>=0.16,<1"]
xaj = ["numpy>=2.2.6,<3", "netCDF4>=1.7,<2"]

xaj-dem = ["numpy>=2.2.6,<3", "netCDF4>=1.7,<2", "pandas>=2,<3", "scipy>=1.15,<2", "matplotlib>=3.9,<4", "pyyaml>=6,<7", "openpyxl>=3.1,<4", "pyproj>=3.6,<4", "rasterio>=1.3,<1.5", "fiona>=1.9,<2", "shapely>=2,<3", "pyflwdir==0.5.10"]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "httpx>=0.28,<1"]
agent-openai = ["openai>=1"]
api = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "langgraph>=0.4,<1", "langchain-core>=0.3,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydro_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/hydro_agent/skills/data-check" = "hydro_agent/skills/data-check"
"src/hydro_agent/skills/forecast-diagnose" = "hydro_agent/skills/forecast-diagnose"
"src/hydro_agent/skills/gbt-22482-accuracy" = "hydro_agent/skills/gbt-22482-accuracy"
"src/hydro_agent/skills/xaj-calibration-protocol" = "hydro_agent/skills/xaj-calibration-protocol"
"src/hydro_agent/skills/xaj-water-balance" = "hydro_agent/skills/xaj-water-balance"
"src/hydro_agent/skills/xaj-recession-analysis" = "hydro_agent/skills/xaj-recession-analysis"
"src/hydro_agent/skills/xaj-flood-routing" = "hydro_agent/skills/xaj-flood-routing"
"src/hydro_agent/skills/xaj-joint-refinement" = "hydro_agent/skills/xaj-joint-refinement"
"src/hydro_agent/skills/hydro-event-bank" = "hydro_agent/skills/hydro-event-bank"
"src/hydro_agent/skills/calibration-convergence" = "hydro_agent/skills/calibration-convergence"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Keep the supplied numerical source byte-identical for provenance verification.
[tool.ruff.lint.per-file-ignores]
"src/hydro_agent/models/xaj/vendor/*.py" = ["ALL"]
